name: build
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bins --examples
      - run: |
          mkdir -p out/profiles out/examples
          # Copy server, challenge, and proxy binaries
          cp target/release/challenge target/release/capture-proxy target/release/cfsolve-server out/
          cp -r profiles/. out/profiles/
          find target/release/examples -maxdepth 1 -type f -perm -u+x -exec cp {} out/examples/ \;
          tar czf cfsolve-linux-${{ matrix.arch }}.tar.gz -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: cfsolve-linux-${{ matrix.arch }}
          path: cfsolve-linux-${{ matrix.arch }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          echo "Publishing release for tag: ${TAG_NAME}"
          gh release create "${TAG_NAME}" dist/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "cfsolve ${TAG_NAME}" \
            --notes "Linux release builds of cfsolve.

          Assets:
          - cfsolve-linux-x86_64.tar.gz (Linux x86_64)
          - cfsolve-linux-aarch64.tar.gz (Linux ARM64)

          Each archive contains \`cfsolve-server\`, \`challenge\`, \`capture-proxy\`, \`profiles/\`, and \`examples/\`." \
            --generate-notes || gh release upload "${TAG_NAME}" dist/*.tar.gz --clobber --repo "${GITHUB_REPOSITORY}"
